version: 2.1

commands:
  notify-app-version:
    parameters:
      status:
        type: string
    steps:
      - run: |
          curl -fsS -X POST "$ALGOPS_NOTIFY_URL/ops/versions" \
            -H "X-Api-Key: $NOTIFY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"app\":\"$CIRCLE_PROJECT_REPONAME\",\"version\":\"${CIRCLE_TAG#v}\",\"status\":\"<< parameters.status >>\"}"

jobs:

  setup:
    docker:
    - image: node:20
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-v2-{{ checksum "package-lock.json" }}
            - npm-deps-v2-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: npm-deps-v2-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - persist_to_workspace:
          root: .
          paths:
            - .

  github-release:
    docker:
    - image: cibuilds/github:0.10
    steps:
      - checkout
      - run:
          name: "Publish Release on GitHub"
          command: |
            ghr -t ${GITHUB_TOKEN} -u ${CIRCLE_PROJECT_USERNAME} -r ${CIRCLE_PROJECT_REPONAME} -c ${CIRCLE_SHA1} -b "`awk '/##.*/{n++;next};n==1;n==2{exit}' CHANGELOG.md`" -delete ${CIRCLE_TAG} ./CHANGELOG.md

  notify-building:
    docker:
      - image: cimg/base:stable
    steps:
      - notify-app-version:
          status: building

  notify-ready:
    docker:
      - image: cimg/base:stable
    steps:
      - notify-app-version:
          status: ready

  tests-unit:
    docker:
    - image: node:20
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install OpenJDK 17 for DynamoDB Local
          command: |
            apt-get update
            apt-get install -y openjdk-17-jre-headless
            java -version
      - restore_cache:
          keys:
            - dynamodb-v1-{{ checksum "package-lock.json" }}
            - dynamodb-v1-
      - run:
          name: Install DynamoDB Local
          command: npm run dynamodb:install
      - save_cache:
          key: dynamodb-v1-{{ checksum "package-lock.json" }}
          paths:
            - .dynamodb
      - run: npm run test:unit

  tests-e2e:
    docker:
    - image: node:20
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install OpenJDK 17 for DynamoDB Local
          command: |
            apt-get update
            apt-get install -y openjdk-17-jre-headless
            java -version
      - restore_cache:
          keys:
            - dynamodb-v1-{{ checksum "package-lock.json" }}
            - dynamodb-v1-
      - run:
          name: Install DynamoDB Local
          command: npm run dynamodb:install
      - save_cache:
          key: dynamodb-v1-{{ checksum "package-lock.json" }}
          paths:
            - .dynamodb
      - run: npm run test:e2e

  lint:
    docker:
    - image: node:20-alpine
    steps:
      - attach_workspace:
          at: .
      - run: npm run lint

workflows:
  version: 2
  default:
    jobs:
      - setup
      - tests-unit:
          requires:
            - setup
      - tests-e2e:
          requires:
            - setup
          context: stripe-tests
      - lint:
          requires:
            - setup
      # Must not require setup: setup has no tag filter, so it never runs on tags.
      - notify-building:
          context: ops-notify
          filters:
            tags:
              only: /^v\d+\.\d+\..*/
            branches:
              ignore: /.*/
      - github-release:
          context: github
          requires:
            - notify-building
          filters:
            tags:
              only: /^v\d+\.\d+\..*/
            branches:
              ignore: /.*/
      - notify-ready:
          requires:
            - github-release
          context: ops-notify
          filters:
            tags:
              only: /^v\d+\.\d+\..*/
            branches:
              ignore: /.*/
